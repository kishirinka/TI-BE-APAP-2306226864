<!DOCTYPE html>
<html>
<head>
    <title>Backend Test</title>
</head>
<body>
    <h1>Backend Connection Test</h1>
    <button onclick="testBackend()">Test Backend Connection</button>
    <div id="result"></div>

    <script>
        async function testBackend() {
            const result = document.getElementById('result');
            result.innerHTML = 'Testing...';
            
            try {
                // Test 1: Health check
                const healthResponse = await fetch('http://localhost:8080/actuator/health');
                console.log('Health check:', healthResponse.status);
                
                // Test 2: Insurance plans endpoint
                const plansResponse = await fetch('http://localhost:8080/api/insurance-plans');
                console.log('Insurance plans response:', plansResponse.status);
                
                if (plansResponse.ok) {
                    const data = await plansResponse.json();
                    result.innerHTML = `
                        <h3>✅ Backend is working!</h3>
                        <p>Status: ${plansResponse.status}</p>
                        <p>Data received: ${JSON.stringify(data, null, 2)}</p>
                    `;
                } else {
                    result.innerHTML = `
                        <h3>❌ Backend error</h3>
                        <p>Status: ${plansResponse.status}</p>
                        <p>Error: ${await plansResponse.text()}</p>
                    `;
                }
            } catch (error) {
                result.innerHTML = `
                    <h3>❌ Connection failed</h3>
                    <p>Error: ${error.message}</p>
                    <p>Make sure backend is running on port 8080</p>
                `;
            }
        }
    </script>
</body>
</html>
